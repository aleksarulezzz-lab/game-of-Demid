<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Коты-драчуны</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #9fd4ff; overflow: hidden; font-family: "Arial Black", Arial, sans-serif; color: #fff; user-select: none; }
  canvas#gl { display: block; position: fixed; inset: 0; }
  #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; font-size: 18px; text-shadow: 2px 2px 0 #000; z-index: 2; }
  .bar { width: 220px; height: 18px; background: #500; border: 2px solid #000; margin-top: 4px; border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(#ff9de0, #e0479b); transition: width .15s; }
  #screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(40,30,15,.88); text-align: center; gap: 14px; padding: 16px; z-index: 10; overflow-y: auto; }
  #screen h1 { font-size: 56px; color: #ffcf4a; text-shadow: 4px 4px 0 #6b3e00; letter-spacing: 2px; }
  #screen h2 { font-size: 30px; color: #ffcf4a; text-shadow: 3px 3px 0 #000; }
  #screen p { font-family: Arial, sans-serif; font-size: 18px; line-height: 1.55; color: #f3e6c8; max-width: 780px; }
  #screen .say { font-size: 22px; background: rgba(255,255,255,.08); border-radius: 14px; padding: 14px 20px; }
  #screen .btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  #screen button { font: inherit; font-size: 22px; padding: 12px 30px; background: #c8752a; color: #fff; border: 4px solid #6b3a10; border-radius: 12px; cursor: pointer; box-shadow: 0 6px 0 #6b3a10; }
  #screen button.alt { background: #5a7a9a; border-color: #2a3a5a; box-shadow: 0 6px 0 #2a3a5a; }
  #screen button kbd { font-family: Arial, sans-serif; font-size: 15px; background: rgba(0,0,0,.3); border-radius: 6px; padding: 2px 8px; margin-left: 8px; vertical-align: middle; }
  #screen table { font-family: Arial, sans-serif; font-size: 18px; color: #f3e6c8; border-spacing: 10px 6px; }
  #screen input[type=file] { font-size: 13px; color: #ccc; }
  .hidden { display: none !important; }
  #banner { position: fixed; top: 30%; width: 100%; text-align: center; font-size: 50px; color: #ffcf4a; text-shadow: 4px 4px 0 #000; pointer-events: none; opacity: 0; transition: opacity .4s; z-index: 3; }
  #toast { position: fixed; top: 62%; width: 100%; text-align: center; font-size: 26px; text-shadow: 3px 3px 0 #000; pointer-events: none; z-index: 3; }
  #hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 16px; text-shadow: 2px 2px 0 #000; pointer-events: none; font-family: Arial, sans-serif; font-weight: bold; z-index: 2; }
  #cross { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 3px solid rgba(255,255,255,.8); border-radius: 50%; pointer-events: none; z-index: 2; box-shadow: 0 0 0 2px rgba(0,0,0,.3); }
  #cross.lock { border-color: #ff4a4a; width: 30px; height: 30px; margin: -15px 0 0 -15px; }
  #hurt { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse at center, rgba(255,0,0,0) 45%, rgba(255,0,0,.6) 100%); opacity: 0; }
  #stunned { position: fixed; top: 22%; width: 100%; text-align: center; font-size: 40px; pointer-events: none; z-index: 3; text-shadow: 3px 3px 0 #000; color: #9fe8ff; }
  #mini { position: fixed; right: 12px; bottom: 12px; z-index: 2; border: 3px solid rgba(0,0,0,.5); border-radius: 6px; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; background: #3d6b2a; z-index: 20; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hurt"></div>
<div id="cross" class="hidden"></div>
<div id="hud" class="hidden">
  <div>
    😺 БАРСИК
    <div class="bar"><div id="hp" style="width:100%"></div></div>
  </div>
  <div style="text-align:center"><span id="lvl">Уровень 1</span><br><span id="left" style="font-size:15px"></span></div>
  <div style="text-align:right">
    🐟 Рыбий хвост: всегда<br>
    🪨 Камешки: <span id="stones">—</span><br>
    🧶 Клубки: <span id="clews">—</span>
  </div>
</div>
<div id="banner"></div>
<div id="toast"></div>
<div id="stunned" class="hidden">⭐ ОГЛУШЁН! ⭐</div>
<div id="hint"></div>
<canvas id="mini" width="182" height="133" class="hidden"></canvas>
<div id="screen"></div>
<div id="loading">Загружаю деревню Мурлыкино… 🐱</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const MW = 2600, MH = 1900;
const S = 1 / 40; // 40 игровых точек = 1 метр
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
const screen = document.getElementById('screen');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};

// ---------- Голос Демида ----------
let voices = store.get('kotyVoices', {});
let lastVoice = 0;
function playVoice(k) {
  if (!voices[k]) return false;
  const now = performance.now();
  if (now - lastVoice < 350) return true;
  lastVoice = now;
  try { const a = new Audio(voices[k]); a.play().catch(() => {}); return true; } catch (e) { return false; }
}

// ---------- Звук ----------
let ac;
function sound(type) {
  if ((type === 'meow' || type === 'meowLow') && playVoice('meow')) return;
  if (type === 'boom' && playVoice('boom')) return;
  if (type === 'oy') { if (playVoice('oy')) return; type = 'hit'; }
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;
    const g = ac.createGain(); g.connect(ac.destination);
    if (type === 'boom') {
      const len = ac.sampleRate * 0.5, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const s = ac.createBufferSource(); s.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
      s.connect(f); f.connect(g); g.gain.value = 0.4; s.start();
      return;
    }
    const o = ac.createOscillator(); o.connect(g);
    if (type === 'meow' || type === 'meowLow') {
      const b = type === 'meow' ? 600 : 300;
      o.type = 'triangle';
      o.frequency.setValueAtTime(b, t); o.frequency.linearRampToValueAtTime(b * 1.6, t + .12); o.frequency.linearRampToValueAtTime(b * .8, t + .35);
      g.gain.setValueAtTime(.001, t); g.gain.linearRampToValueAtTime(.12, t + .05); g.gain.exponentialRampToValueAtTime(.001, t + .38);
      o.start(t); o.stop(t + .4); return;
    }
    const cfg = { swipe: ['sawtooth', 900, 200, .05, .08], throw: ['triangle', 300, 700, .08, .1], hit: ['square', 220, 60, .08, .1], grass: ['triangle', 1200, 400, .06, .15], pick: ['triangle', 500, 1200, .12, .15], stun: ['sine', 1500, 800, .08, .3] }[type];
    if (!cfg) return;
    o.type = cfg[0]; o.frequency.setValueAtTime(cfg[1], t); o.frequency.exponentialRampToValueAtTime(cfg[2], t + cfg[4]);
    g.gain.setValueAtTime(cfg[3], t); g.gain.exponentialRampToValueAtTime(0.001, t + cfg[4]);
    o.start(t); o.stop(t + cfg[4]);
  } catch (e) {}
}

// ---------- Управление (только клавиатура) ----------
const keys = {};
function nearestEnemy(c, maxD) {
  let best = null, bd = maxD;
  for (const o of cats) if (o.team !== c.team && o.hp > 0) { const d = dist(c, o); if (d < bd) { bd = d; best = o; } }
  return best;
}
// мягкий автоприцел: хулиган примерно впереди
function aimTarget() {
  let best = null, bs = 1e9;
  for (const o of cats) {
    if (o.team === 0 || o.hp <= 0) continue;
    const d = dist(player, o);
    if (d > 560) continue;
    const da = Math.abs(angDiff(Math.atan2(o.y - player.y, o.x - player.x), player.angle));
    if (da > 0.45) continue;
    const sc = da * 300 + d;
    if (sc < bs) { bs = sc; best = o; }
  }
  return best;
}
const aim = () => {
  const t = aimTarget();
  if (t) return { x: t.x, y: t.y };
  return { x: player.x + Math.cos(player.angle) * 400, y: player.y + Math.sin(player.angle) * 400 };
};
let screenKeys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!screen.classList.contains('hidden')) {
    if (e.repeat) return;
    const fn = screenKeys[e.code] || (e.code === 'NumpadEnter' && screenKeys.Enter);
    if (fn) { e.preventDefault(); fn(); }
    return;
  }
  if (state !== 'play' || e.repeat) return;
  if (e.code === 'KeyX') throwStone(player, aim());
  if (e.code === 'KeyC') throwClew(player, aim());
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------- Уровни (сюжет) ----------
const LEVELS = [
  { name: 'Драка у колодца', story: 'Трое дворовых котов-хулиганов пристают к цыплятам у колодца. Камешков пока нет — только рыбий хвост-дубинка! Подойди и бей кнопкой Z или Пробелом. Увидишь ❗ над хулиганом — бей первым или отбегай!',
    stones: false, clews: false, enemies: [['Сеня', 40], ['Пушок', 40], ['Мурзик', 40]] },
  { name: 'Камешковая перестрелка', story: 'Хулиганы нашли у речки камешки и кидаются издалека! Кидай камешки в ответ — кнопка X. У тебя один камешек, а за каждого побеждённого хулигана дают ещё два. Промахнёшься — Барсик сам сдерёт траву и кинет её. Трава оглушает!',
    stones: true, clews: false, enemies: [['Тиша', 50], ['Васька', 50], ['Филя', 50], ['Сеня', 50]] },
  { name: 'Клубочная битва', story: 'Банда утащила у бабушки корзинку с клубками! Клубок — это граната: разлетается на ниточки, а рядом со взрывом жжётся огнём. Кнопка C — кинуть клубок. Он у тебя один, ещё можно найти в корзинке 🧺. Не стой рядом сам!',
    stones: true, clews: true, enemies: [['Тиша', 60], ['Васька', 60], ['Дымок', 60], ['Филя', 60], ['Пират', 60]] },
  { name: 'Рыжий Атаман', story: 'Сам Рыжий Атаман вышел из сарая! Он большой, сильный и кидает сразу по два клубка. Победи его, и деревня Мурлыкино будет спасена! Только почему Атаман такой сердитый? Может, у него что-то случилось…',
    stones: true, clews: true, boss: true, enemies: [['Рыжий Атаман', 220, true], ['Дымок', 60], ['Пират', 60]] },
];
const ENEMY_COLORS = [['#7a7a7a', '#555'], ['#2b2b2b', '#111'], ['#b9a07a', '#8a7350'], ['#ffffff', '#ccc'], ['#9a6a3a', '#5e3c1c'], ['#c9c9c9', '#8a8a8a']];

// ---------- Мир ----------
let houses = [], trees = [], hay = [], fences = [], pond, well, tufts = [], flowers = [], paths = [], bald = [];
function makeMap() {
  houses = [
    { x: 260, y: 220, w: 220, h: 170, roof: '#b5402f' }, { x: 900, y: 160, w: 200, h: 160, roof: '#5b6f8f' },
    { x: 1700, y: 230, w: 240, h: 170, roof: '#8a5a2b' }, { x: 2200, y: 700, w: 200, h: 180, roof: '#b5402f' },
    { x: 300, y: 1300, w: 230, h: 170, roof: '#6a8a3b' }, { x: 1150, y: 1450, w: 220, h: 170, roof: '#8a5a2b' },
    { x: 1950, y: 1350, w: 280, h: 200, roof: '#7a4a7a', barn: true },
  ];
  well = { x: 1300, y: 900, r: 34 };
  pond = { x: 650, y: 820, rx: 170, ry: 110 };
  trees = []; hay = []; fences = []; tufts = []; flowers = []; bald = [];
  const tp = [[150, 700], [180, 1000], [560, 560], [1500, 500], [1560, 640], [2450, 300], [2400, 1150], [900, 1150], [1650, 1050], [100, 1700], [800, 1750], [1550, 1780], [2500, 1750], [1250, 650], [2050, 960]];
  for (const [x, y] of tp) trees.push({ x, y, r: rnd(30, 44) });
  for (const [x, y] of [[1050, 450], [1100, 480], [1800, 800], [700, 1450], [2350, 500]]) hay.push({ x, y, r: 28 });
  // заборы вокруг огородов
  fences.push({ x: 1600, y: 1000, w: 10, h: 180 }, { x: 1600, y: 1000, w: 160, h: 10 });
  fences.push({ x: 560, y: 1100, w: 200, h: 10 }, { x: 750, y: 1100, w: 10, h: 120 });
  fences.push({ x: 2050, y: 450, w: 10, h: 160 });
  paths = [[[0, 950], [600, 980], [1300, 960], [2000, 1000], [2600, 960]], [[1300, 0], [1280, 500], [1300, 960], [1320, 1400], [1300, 1900]]];
  for (let i = 0; i < 700; i++) tufts.push({ x: rnd(0, MW), y: rnd(0, MH), s: rnd(3, 7) });
  for (let i = 0; i < 160; i++) flowers.push({ x: rnd(0, MW), y: rnd(0, MH), c: ['#ffef5a', '#ff8ad8', '#ffffff', '#8ad0ff'][i % 4] });
}
// твёрдые препятствия (останавливают котов и камешки)
function solidRects() { return houses.concat(fences); }
function solidCircles() { return trees.concat(hay, [well]); }
function circleRect(x, y, r, b) {
  const cx = clamp(x, b.x, b.x + b.w), cy = clamp(y, b.y, b.y + b.h);
  return (x - cx) ** 2 + (y - cy) ** 2 < r * r;
}
function blocked(x, y, r, forCat) {
  if (x < r || y < r || x > MW - r || y > MH - r) return true;
  for (const b of solidRects()) if (circleRect(x, y, r, b)) return true;
  for (const c of solidCircles()) if ((x - c.x) ** 2 + (y - c.y) ** 2 < (r + c.r * 0.8) ** 2) return true;
  if (forCat) { const dx = (x - pond.x) / (pond.rx + r * 0.5), dy = (y - pond.y) / (pond.ry + r * 0.5); if (dx * dx + dy * dy < 1) return true; }
  return false;
}

// ---------- Объекты ----------
let player, cats, projs, clews, fires, parts, texts, pickups, swipes;
let endTimer, state = 'menu', levelIdx = 0, shake = 0, lastTime = 0, pickupTimer = 0, hintTimer = 0;

function makeCat(o) {
  return Object.assign({ r: 20, hp: 100, maxHp: 100, angle: 0, speed: 210, walk: 0, cdPaw: 0, cdStone: 0, cdClew: 0, stun: 0, hurt: 0, swipeT: 0,
    tearT: 0, grassTarget: null, stones: 0, clews: 0, vx: 0, vy: 0, kx: 0, ky: 0, tailPhase: rnd(0, 6) }, o);
}

function startLevel(i) {
  levelIdx = i; clearTimeout(endTimer);
  const L = LEVELS[i];
  makeMap();
  store.set('kotyLevel', Math.max(store.get('kotyLevel', 0), i));
  const keepHp = player && i > 0 ? Math.max(player.hp, 60) : 100;
  player = makeCat({ x: 1300, y: 1150, color: '#f0a040', dark: '#c06a10', stripes: true, isPlayer: true, name: 'Барсик', hp: keepHp,
    stones: L.stones ? 1 : 0, clews: L.clews ? 1 : 0, team: 0, angle: -Math.PI / 2 });
  cats = [player];
  const spots = [[900, 760], [1750, 700], [1800, 1300], [800, 1400], [1700, 1650], [1000, 620], [1900, 1100]];
  L.enemies.forEach(([name, hp, boss], k) => {
    let [x, y] = spots[k % spots.length];
    if (boss) { x = 2090; y = 1600; }
    const col = boss ? ['#e8692a', '#a8400a'] : ENEMY_COLORS[k % ENEMY_COLORS.length];
    cats.push(makeCat({ x, y, name, hp, maxHp: hp, color: col[0], dark: col[1], stripes: boss || k % 2 === 0, boss, r: boss ? 32 : 20,
      speed: boss ? 150 : rnd(140, 175), stones: L.stones ? 999 : 0, clews: L.clews ? (boss ? 99 : 2) : 0, team: 1,
      think: rnd(0, 1), strafe: Math.random() < .5 ? 1 : -1, wake: 0.8 + k * 0.3 }));
  });
  projs = []; clews = []; fires = []; parts = []; texts = []; pickups = []; swipes = [];
  pickupTimer = 6;
  build3D();
  updateHud();
  state = 'play';
  banner(`Уровень ${i + 1}: ${L.name}`);
  hint(L.stones ? (L.clews ? '← → повернуться, ↑ ↓ бежать, Z — рыбий хвост, X — камешек, C — клубок 🧶' : '← → повернуться, ↑ ↓ бежать, Z — рыбий хвост, X — камешек 🪨') : '← → повернуться, ↑ ↓ бежать, Z или ПРОБЕЛ — удар рыбьим хвостом 🐟');
}

function banner(text) {
  const b = document.getElementById('banner');
  b.textContent = text; b.style.opacity = 1;
  clearTimeout(b._t); b._t = setTimeout(() => b.style.opacity = 0, 2000);
}
function hint(t) { document.getElementById('hint').textContent = t; hintTimer = 8; }
let toastT;
function floatText(x, y, t, c = '#fff', size = 20) {
  // привязываем надпись к ближайшему коту (она висит над ним)
  let who = null;
  for (const k of cats || []) if (Math.abs(k.x - x) < 35 && k.y - y >= -15 && k.y - y < 90) { who = k; break; }
  if (who && who.isPlayer) {
    const el = document.getElementById('toast');
    el.textContent = t; el.style.color = c; clearTimeout(toastT); toastT = setTimeout(() => el.textContent = '', 900);
    return;
  }
  texts.push({ x: who ? who.x : x, y: who ? who.y : y, t, c, size, life: 1, who, h: who ? who.r * 2.6 * S + 0.3 : 1 });
}

function updateHud() {
  const L = LEVELS[levelIdx];
  document.getElementById('hp').style.width = Math.max(0, player.hp) + '%';
  document.getElementById('lvl').textContent = `Уровень ${levelIdx + 1}: ${L.name}`;
  const left = cats.filter(c => c.team === 1 && c.hp > 0).length;
  document.getElementById('left').textContent = `Хулиганов осталось: ${left}`;
  document.getElementById('stones').textContent = L.stones ? player.stones : 'ещё нет';
  document.getElementById('clews').textContent = L.clews ? player.clews : 'ещё нет';
}

// ---------- Атаки ----------
function pawAttack(c) {
  if (c.cdPaw > 0 || c.stun > 0 || c.tearT > 0) return;
  const club = c.isPlayer, reach = club ? 62 : 30;
  c.cdPaw = club ? 0.4 : (c.boss ? 0.7 : 0.45); c.swipeT = 0.2;
  swipes.push({ x: c.x, y: c.y, a: c.angle, r: c.r + reach, club, life: 0.2, side: (c.swipeSide = -(c.swipeSide || 1)) });
  sound('swipe');
  for (const o of cats) {
    if (o === c || o.hp <= 0 || o.team === c.team) continue;
    const d = dist(c, o);
    if (d < c.r + o.r + reach && Math.abs(angDiff(Math.atan2(o.y - c.y, o.x - c.x), c.angle)) < (club ? 1.3 : 1.1)) {
      damage(o, club ? 12 : (c.boss ? 12 : 7), c, club ? 'рыбой' : 'лапкой');
      if (club) { o.windup = 0; if (!o.boss) o.stun = Math.max(o.stun, 0.3); floatText(o.x, o.y - o.r - 34, 'ШМЯК!', '#9fe8ff', 16); }
      const k = (club ? (o.boss ? 250 : 480) : c.boss ? 420 : 300) / (d || 1);
      o.kx += (o.x - c.x) * k; o.ky += (o.y - c.y) * k;
      for (let i = 0; i < 6; i++) parts.push({ x: o.x, y: o.y, vx: rnd(-150, 150), vy: rnd(-150, 150), life: .4, c: c.color, s: 3 });
    }
  }
}

function throwStone(c, t) {
  if (!LEVELS[levelIdx].stones || c.cdStone > 0 || c.stun > 0 || c.tearT > 0) return;
  if (c.stones <= 0) { if (c.isPlayer) floatText(c.x, c.y - 40, 'Нет камешков! Победи хулигана', '#ccc', 16); return; }
  c.stones--; c.cdStone = c.boss ? 0.6 : 0.5;
  const a = Math.atan2(t.y - c.y, t.x - c.x); if (!c.isPlayer) c.angle = a; c.throwT = .25;
  projs.push({ type: 'stone', x: c.x + Math.cos(a) * c.r, y: c.y + Math.sin(a) * c.r, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, range: 460, owner: c, spin: 0, target: { x: t.x, y: t.y } });
  sound('throw');
  if (c.isPlayer) updateHud();
}

// промах камешком -> котик дерёт траву и кидает её (оглушает)
function startGrass(c, target) {
  if (c.hp <= 0 || c.stun > 0) return;
  c.tearT = 0.35; c.grassTarget = target;
  groundDirty = true;
  bald.push({ x: c.x + Math.cos(c.angle) * 14, y: c.y + Math.sin(c.angle) * 14, r: rnd(10, 14) });
  for (let i = 0; i < 10; i++) parts.push({ x: c.x, y: c.y, vx: rnd(-120, 120), vy: rnd(-160, 40), life: .5, c: i % 2 ? '#4caf32' : '#7a5a30', s: 3 });
  if (c.isPlayer) floatText(c.x, c.y - 44, 'Дёрг травку!', '#8f8', 18);
  sound('grass');
}
function throwGrass(c) {
  let t = c.grassTarget;
  if (c.isPlayer) t = aim();
  else { const p = player; t = { x: p.x + p.vx * 0.3, y: p.y + p.vy * 0.3 }; }
  const a = Math.atan2(t.y - c.y, t.x - c.x); if (!c.isPlayer) c.angle = a; c.throwT = .25;
  projs.push({ type: 'grass', x: c.x + Math.cos(a) * c.r, y: c.y + Math.sin(a) * c.r, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, range: 440, owner: c, spin: 0 });
  sound('throw');
}

function throwClew(c, t) {
  if (!LEVELS[levelIdx].clews || c.cdClew > 0 || c.stun > 0 || c.tearT > 0) return;
  if (c.clews <= 0) { if (c.isPlayer) floatText(c.x, c.y - 40, 'Нет клубков!', '#ccc', 16); return; }
  c.clews--; c.cdClew = c.boss ? 2.2 : 1;
  const d = Math.min(dist(c, t), 380), a = Math.atan2(t.y - c.y, t.x - c.x); if (!c.isPlayer) c.angle = a; c.throwT = .25;
  const n = c.boss ? 2 : 1;
  for (let k = 0; k < n; k++) {
    const aa = a + (n > 1 ? (k - .5) * 0.5 : 0);
    clews.push({ sx: c.x, sy: c.y, ex: c.x + Math.cos(aa) * d, ey: c.y + Math.sin(aa) * d, t: 0, dur: 0.7 + d / 900, owner: c, color: ['#e84a6a', '#4a8ae8', '#9a4ae8', '#3ab85a'][Math.floor(rnd(0, 4))] });
  }
  sound('throw');
  if (c.isPlayer) updateHud();
}

function explodeClew(k) {
  sound('boom'); shake = Math.max(shake, 10);
  // ниточки разлетаются во все стороны
  const N = 14;
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2 + rnd(-.1, .1);
    projs.push({ type: 'thread', x: k.ex, y: k.ey, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, range: 240, owner: k.owner, color: k.color, hit: new Set(), wob: rnd(0, 6) });
  }
  // огонь рядом со взрывом
  fires.push({ x: k.ex, y: k.ey, r: 85, life: 1.2 });
  for (const o of cats) if (o.hp > 0 && dist(o, k) < 85 + o.r * .5) damage(o, 5, k.owner, 'огнём', '#ff8a2a');
  for (let i = 0; i < 25; i++) parts.push({ x: k.ex, y: k.ey, vx: rnd(-200, 200), vy: rnd(-200, 200), life: rnd(.4, .9), c: ['#ffcf4a', '#ff7a2a', '#ff3a1a'][i % 3], s: rnd(3, 6) });
}

function damage(o, dmg, from, how, col) {
  if (o.hp <= 0) return;
  o.hp -= dmg; o.hurt = 0.25;
  floatText(o.x + rnd(-10, 10), o.y - o.r - 10, '-' + dmg, col || (o.isPlayer ? '#ff6a6a' : '#ffef6a'), 22);
  if (o.isPlayer) { shake = Math.max(shake, 6); sound('oy'); } else sound('hit');
  if (o.hp <= 0) {
    o.hp = 0;
    floatText(o.x, o.y - 50, o.isPlayer ? 'Мяу-у-у…' : o.boss ? 'Сдаюсь! Мяу…' : `${o.name} убежал!`, '#fff', 22);
    sound('meowLow');
    if (!o.isPlayer) {
      if (o.boss) o.surrender = true; else o.flee = 1.6;
      if (Math.random() < .55) pickups.push({ x: o.x, y: o.y, type: 'fish', t: 0 });
      if (LEVELS[levelIdx].stones) { player.stones += 2; floatText(player.x, player.y - 60, '+2 🪨', '#ddd', 22); }
    }
  }
  updateHud();
}

function stun(o, sec) {
  if (o.hp <= 0) return;
  o.stun = Math.max(o.stun, sec); o.windup = 0;
  floatText(o.x, o.y - o.r - 30, 'ОГЛУШЁН!', '#9fe8ff', 20);
  sound('stun');
}

// ---------- Обновление ----------
function update(dt) {
  const L = LEVELS[levelIdx];
  // игрок
  if (player.hp > 0) {
    // ← → поворот, ↑ ↓ вперёд/назад, Q/E — шаг вбок
    let turn = 0, fwd = 0, side = 0;
    if (keys.ArrowLeft || keys.KeyA) turn--; if (keys.ArrowRight || keys.KeyD) turn++;
    if (keys.ArrowUp || keys.KeyW) fwd++; if (keys.ArrowDown || keys.KeyS) fwd--;
    if (keys.KeyQ) side--; if (keys.KeyE) side++;
    if (player.stun <= 0) player.angle += turn * 2.5 * dt;
    const a = player.angle;
    const vx = Math.cos(a) * fwd + Math.cos(a + Math.PI / 2) * side, vy = Math.sin(a) * fwd + Math.sin(a + Math.PI / 2) * side;
    const m = Math.hypot(vx, vy), sp = player.speed * (fwd < 0 && !side ? .6 : 1);
    player.vx = m ? vx / m * sp : 0; player.vy = m ? vy / m * sp : 0;
    if (keys.Space || keys.KeyZ) pawAttack(player);
  }
  // враги
  for (const c of cats) if (c.team === 1) enemyAI(c, dt, L);

  for (const c of cats) {
    c.cdPaw -= dt; c.cdStone -= dt; c.cdClew -= dt; c.hurt -= dt; c.swipeT -= dt; c.throwT = (c.throwT || 0) - dt;
    if (c.stun > 0) { c.stun -= dt; c.vx = c.vy = 0; }
    if (c.tearT > 0) { c.tearT -= dt; c.vx = c.vy = 0; if (c.tearT <= 0) throwGrass(c); }
    if (c.hp <= 0 && !c.isPlayer) continue;
    if (c.hp <= 0) { c.vx = c.vy = 0; }
    const sx = (c.vx + c.kx) * dt, sy = (c.vy + c.ky) * dt;
    if (!blocked(c.x + sx, c.y, c.r, true)) c.x += sx; else c.kx = 0;
    if (!blocked(c.x, c.y + sy, c.r, true)) c.y += sy; else c.ky = 0;
    c.kx *= Math.pow(0.002, dt); c.ky *= Math.pow(0.002, dt);
    if (Math.hypot(c.vx, c.vy) > 5) c.walk += dt * 12;
    c.tailPhase += dt * (c.stun > 0 ? 2 : 5);
  }
  // коты не залезают друг в друга
  const alive = cats.filter(c => c.hp > 0);
  for (let i = 0; i < alive.length; i++) for (let j = i + 1; j < alive.length; j++) {
    const a = alive[i], b = alive[j], d = dist(a, b), min = a.r + b.r;
    if (d < min && d > 0) {
      const push = (min - d) / 2, nx = (b.x - a.x) / d, ny = (b.y - a.y) / d;
      if (!blocked(a.x - nx * push, a.y - ny * push, a.r, true)) { a.x -= nx * push; a.y -= ny * push; }
      if (!blocked(b.x + nx * push, b.y + ny * push, b.r, true)) { b.x += nx * push; b.y += ny * push; }
    }
  }
  // убежавшие хулиганы исчезают
  for (const c of cats) if (c.team === 1 && c.hp <= 0 && c.flee !== undefined) {
    c.flee -= dt; const a = Math.atan2(c.y - player.y, c.x - player.x);
    c.x += Math.cos(a) * 300 * dt; c.y += Math.sin(a) * 300 * dt; c.walk += dt * 20;
  }
  cats = cats.filter(c => c.isPlayer || c.hp > 0 || c.flee > 0 || c.surrender);

  // снаряды
  for (const p of projs) {
    const step = Math.hypot(p.vx, p.vy) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.range -= step; p.spin = (p.spin || 0) + dt * 15;
    if (p.type === 'thread') p.wob += dt * 20;
    let done = false;
    for (const o of cats) {
      if (o.hp <= 0 || o === p.owner) continue;
      if (p.type !== 'thread' && o.team === p.owner.team) continue;
      if (p.type === 'thread' && p.hit.has(o)) continue;
      if (dist(p, o) < o.r + 6) {
        if (p.type === 'stone') { damage(o, p.owner.isPlayer ? 15 : 7, p.owner, 'камешком'); o.kx += p.vx * .3; o.ky += p.vy * .3; }
        if (p.type === 'grass') { damage(o, 5, p.owner, 'травой', '#8f8'); stun(o, 2); }
        if (p.type === 'thread') { damage(o, 5, p.owner, 'ниточкой', '#ff9de0'); p.hit.add(o); }
        p.hitSomeone = true;
        if (p.type !== 'thread') done = true;
        break;
      }
    }
    if (!done && (p.range <= 0 || blocked(p.x, p.y, 3, false))) {
      done = true;
      if (p.type === 'stone' && !p.hitSomeone) {
        // промах!
        parts.push({ x: p.x, y: p.y, vx: 0, vy: 0, life: .3, c: '#999', s: 5 });
        startGrass(p.owner, p.target);
      }
      if (p.type === 'grass') for (let i = 0; i < 6; i++) parts.push({ x: p.x, y: p.y, vx: rnd(-80, 80), vy: rnd(-80, 80), life: .5, c: '#4caf32', s: 3 });
    }
    p.dead = done;
  }
  projs = projs.filter(p => !p.dead);

  // клубки летят
  for (const k of clews) {
    k.t += dt / k.dur;
    k.x = k.sx + (k.ex - k.sx) * Math.min(k.t, 1); k.y = k.sy + (k.ey - k.sy) * Math.min(k.t, 1);
    if (k.t >= 1 && !k.done) { k.done = true; explodeClew(k); }
  }
  clews = clews.filter(k => !k.done);
  for (const f of fires) f.life -= dt;
  fires = fires.filter(f => f.life > 0);
  for (const s of swipes) s.life -= dt;
  swipes = swipes.filter(s => s.life > 0);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .92; p.vy *= .92; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { if (t.who) { t.x = t.who.x; t.y = t.who.y; } t.h += .6 * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);

  // бонусы
  pickupTimer -= dt;
  if (pickupTimer <= 0) {
    pickupTimer = rnd(7, 11);
    const types = ['fish'];
    if (L.clews) types.push('basket');
    let x, y, n = 0;
    do { x = rnd(80, MW - 80); y = rnd(80, MH - 80); n++; } while (blocked(x, y, 30, true) && n < 40);
    if (pickups.length < 5) pickups.push({ x, y, type: types[Math.floor(rnd(0, types.length))], t: 0 });
  }
  for (const p of pickups) {
    p.t += dt; if (p.life) p.life -= dt;
    if (player.hp > 0 && dist(p, player) < player.r + 18) {
      p.taken = true; sound('pick');
      if (p.type === 'fish') { player.hp = Math.min(100, player.hp + 25); floatText(p.x, p.y, '+25 🐟', '#8ff'); }
      if (p.type === 'stones') { player.stones += 6; floatText(p.x, p.y, '+6 🪨', '#ddd'); }
      if (p.type === 'stone1') { player.stones += 1; }
      if (p.type === 'basket') { player.clews += 1; floatText(p.x, p.y, '+1 🧶', '#f9c'); }
      updateHud();
    }
  }
  pickups = pickups.filter(p => !p.taken && !(p.life !== undefined && p.life <= 0));

  shake *= 0.88;
  hintTimer -= dt; if (hintTimer <= 0) document.getElementById('hint').textContent = '';

  // победа / поражение
  if (player.hp <= 0 && state === 'play') { state = 'lose'; endTimer = setTimeout(showLose, 1500); }
  if (state === 'play' && !cats.some(c => c.team === 1 && c.hp > 0)) { state = 'win'; sound('meow'); endTimer = setTimeout(showWin, 1600); banner('ПОБЕДА! МЯУ!'); }
}

function enemyAI(c, dt, L) {
  c.vx = c.vy = 0;
  if (c.hp <= 0 || c.stun > 0 || c.tearT > 0 || player.hp <= 0) return;
  if (c.wake > 0) { c.wake -= dt; return; }
  const p = player, d = dist(c, p);
  const toP = Math.atan2(p.y - c.y, p.x - c.x);
  c.angle = toP;
  c.think -= dt;
  if (c.think <= 0) {
    c.think = rnd(0.25, 0.6);
    if (Math.random() < .15) c.strafe *= -1;
    // кидаем клубок
    if (L.clews && c.clews > 0 && c.cdClew <= 0 && d > 140 && d < 380 && Math.random() < (c.boss ? .45 : .12)) {
      throwClew(c, { x: p.x + rnd(-40, 40), y: p.y + rnd(-40, 40) });
    } else if (L.stones && c.cdStone <= 0 && d > 110 && d < 440 && Math.random() < (c.boss ? .6 : .4)) {
      // хулиганы иногда мажут — и тогда тоже дерут траву
      const miss = rnd(-1, 1) * (c.boss ? 70 : 110);
      throwStone(c, { x: p.x + p.vx * d / 560 + Math.cos(toP + Math.PI / 2) * miss, y: p.y + p.vy * d / 560 + Math.sin(toP + Math.PI / 2) * miss });
      c.cdStone = c.boss ? 1.4 : rnd(2.5, 3.8);
    }
  }
  // замах перед ударом лапкой: над хулиганом появляется ❗
  if (c.windup > 0) {
    c.windup -= dt;
    if (c.windup <= 0) { if (d < c.r + p.r + 34) pawAttack(c); c.cdPaw = rnd(.9, 1.4); c.backoff = rnd(.4, .8); }
    return;
  }
  if (d < c.r + p.r + 24 && c.cdPaw <= 0 && !(c.backoff > 0)) { c.windup = c.boss ? 0.45 : 0.55; return; }
  if (c.backoff > 0) { c.backoff -= dt; c.vx = -Math.cos(toP) * c.speed * .7; c.vy = -Math.sin(toP) * c.speed * .7; return; }
  // движение: в 1 уровне — к игроку вплотную; потом держат дистанцию, но иногда лезут драться
  let want = L.stones && !c.boss ? (c.rush ? 0 : 220) : 0;
  if (Math.random() < dt * 0.15) c.rush = !c.rush;
  let mx = 0, my = 0;
  if (d > want + 30) { mx = Math.cos(toP); my = Math.sin(toP); }
  else if (d < want - 40) { mx = -Math.cos(toP); my = -Math.sin(toP); }
  const sa = toP + Math.PI / 2;
  const st = L.stones ? 0.7 : 0.35;
  mx += Math.cos(sa) * c.strafe * st; my += Math.sin(sa) * c.strafe * st;
  const m = Math.hypot(mx, my) || 1;
  c.vx = mx / m * c.speed; c.vy = my / m * c.speed;
  // объезд препятствий
  if (blocked(c.x + c.vx * .15, c.y + c.vy * .15, c.r, true)) { c.strafe *= -1; const a = Math.atan2(c.vy, c.vx) + c.strafe * 1.4; c.vx = Math.cos(a) * c.speed; c.vy = Math.sin(a) * c.speed; }
}


// ================= 3D: вид из глаз Барсика =================
let renderer, scene, camera, sun, worldGroup, dynGroup, groundTex, groundCanvas, groundDirty = false, groundTimer = 0;
let viewModel, clubPivot, leftPaw, grassInPaw, targetRing;
const live = new Map(); // объект игры -> 3D-модель

function init3D() {
  const canvas = document.getElementById('gl');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  scene.background = new THREE.Color('#9fd4ff');
  scene.fog = new THREE.Fog('#bfe3ff', 25, 70);

const matCache = {};
function mat(color, opts) {
  const k = color + JSON.stringify(opts || {});
  return matCache[k] || (matCache[k] = new THREE.MeshLambertMaterial(Object.assign({ color }, opts)));
}
function box(w, h, d, color) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color)); m.castShadow = m.receiveShadow = true; return m; }
function ball(r, color) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat(color)); m.castShadow = true; return m; }

function textSprite(text, color = '#fff', px = 48, w = 512) {
  const c = document.createElement('canvas'); c.width = w; c.height = px * 1.6;
  const g = c.getContext('2d');
  g.font = `bold ${px}px Arial`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = px / 6; g.strokeStyle = '#000'; g.strokeText(text, w / 2, c.height / 2);
  g.fillStyle = color; g.fillText(text, w / 2, c.height / 2);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set(w / 100, c.height / 100, 1);
  return sp;
}

// ---------- Земля: рисуем деревню на большой картинке ----------
const GS = 0.8;
function drawGround() {
  const g = groundCanvas.getContext('2d');
  g.setTransform(GS, 0, 0, GS, 0, 0);
  g.fillStyle = '#5c9a3a'; g.fillRect(0, 0, MW, MH);
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const [w, c] of [[80, '#b8935a'], [60, '#c9a56a']]) {
    g.strokeStyle = c; g.lineWidth = w;
    for (const pth of paths) { g.beginPath(); pth.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); }
  }
  g.strokeStyle = '#4a8a2c'; g.lineWidth = 2;
  for (const t of tufts) { g.beginPath(); g.moveTo(t.x - t.s, t.y); g.lineTo(t.x, t.y - t.s * 1.5); g.lineTo(t.x + t.s, t.y); g.stroke(); }
  for (const f of flowers) { g.fillStyle = f.c; g.beginPath(); g.arc(f.x, f.y, 4, 0, 7); g.fill(); g.fillStyle = '#fc3'; g.beginPath(); g.arc(f.x, f.y, 1.7, 0, 7); g.fill(); }
  for (const b of bald) { g.fillStyle = '#8a6a3a'; g.beginPath(); g.ellipse(b.x, b.y, b.r, b.r * .75, 0, 0, 7); g.fill(); }
  g.fillStyle = '#3a7ab8'; g.beginPath(); g.ellipse(pond.x, pond.y, pond.rx + 8, pond.ry + 8, 0, 0, 7); g.fill();
  g.fillStyle = '#5aa0e0'; g.beginPath(); g.ellipse(pond.x, pond.y, pond.rx, pond.ry, 0, 0, 7); g.fill();
  g.fillStyle = '#4f9a3a';
  for (const [dx, dy] of [[-90, -30], [60, 40], [20, -60]]) { g.beginPath(); g.arc(pond.x + dx, pond.y + dy, 14, 0.5, 6); g.lineTo(pond.x + dx, pond.y + dy); g.fill(); }
  // тени-пятна под домами
  g.fillStyle = 'rgba(0,0,0,.12)';
  for (const b of houses) g.fillRect(b.x - 8, b.y - 8, b.w + 16, b.h + 16);
  groundTex.needsUpdate = true;
}

function build3D() {
  if (worldGroup) scene.remove(worldGroup);
  for (const [o, m] of live) dynGroup.remove(m);
  live.clear();
  worldGroup = new THREE.Group(); scene.add(worldGroup);
  // земля
  if (!groundCanvas) {
    groundCanvas = document.createElement('canvas'); groundCanvas.width = MW * GS; groundCanvas.height = MH * GS;
    groundTex = new THREE.CanvasTexture(groundCanvas);
    groundTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  }
  drawGround();
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(MW * S, MH * S), new THREE.MeshLambertMaterial({ map: groundTex }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(MW * S / 2, 0, MH * S / 2); ground.receiveShadow = true;
  worldGroup.add(ground);
  // трава за краем карты
  const outer = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), mat('#4f8a32'));
  outer.rotation.x = -Math.PI / 2; outer.position.set(MW * S / 2, -0.02, MH * S / 2); worldGroup.add(outer);
  // вода в пруду чуть блестит
  const water = new THREE.Mesh(new THREE.CircleGeometry(1, 48), new THREE.MeshLambertMaterial({ color: '#6ab4f0', transparent: true, opacity: .55 }));
  water.rotation.x = -Math.PI / 2; water.scale.set(pond.rx * S, pond.ry * S, 1); water.position.set(pond.x * S, 0.03, pond.y * S);
  worldGroup.add(water);
  // дома
  for (const b of houses) {
    const w = b.w * S, d = b.h * S, hgt = b.barn ? 3 : 2.4, cx = (b.x + b.w / 2) * S, cz = (b.y + b.h / 2) * S;
    const walls = box(w, hgt, d, b.barn ? '#9a5a34' : '#ecdcb4'); walls.position.set(cx, hgt / 2, cz); worldGroup.add(walls);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(1, 1.6, 4), mat(b.roof));
    roof.rotation.y = Math.PI / 4; roof.scale.set(w * 0.78, 1, d * 0.78); roof.position.set(cx, hgt + 0.8, cz); roof.castShadow = true;
    worldGroup.add(roof);
    // окна и дверь со всех сторон, чтобы дом было видно отовсюду
    for (const side of [1, -1]) {
      const z = cz + side * (d / 2 + 0.02);
      const door = box(0.8, 1.4, 0.05, '#6a4020'); door.position.set(cx - w * 0.25, 0.7, z); worldGroup.add(door);
      for (const wx of [0.05, 0.3]) { const win = box(0.6, 0.55, 0.05, '#8ad0ff'); win.position.set(cx + w * wx, 1.4, z); worldGroup.add(win); }
    }
    if (b.barn) { const lbl = textSprite('САРАЙ', '#ffcf4a', 64); lbl.position.set(cx, hgt + 2.4, cz); lbl.scale.multiplyScalar(0.8); worldGroup.add(lbl); }
  }
  // деревья-яблони
  for (const t of trees) {
    const R = t.r * S;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(R * .25, R * .32, R * 1.6, 8), mat('#7a4a22'));
    trunk.position.set(t.x * S, R * .8, t.y * S); trunk.castShadow = true; worldGroup.add(trunk);
    const crown = ball(R * 1.15, '#3f8a2c'); crown.position.set(t.x * S, R * 1.9, t.y * S); worldGroup.add(crown);
    const crown2 = ball(R * .8, '#4fa03a'); crown2.position.set(t.x * S - R * .3, R * 2.5, t.y * S - R * .2); worldGroup.add(crown2);
    for (let i = 0; i < 6; i++) { const ap = ball(R * .12, '#e83a3a'); const a = i * 1.1 + t.r; ap.position.set(t.x * S + Math.cos(a) * R * 1.05, R * (1.6 + (i % 3) * .3), t.y * S + Math.sin(a) * R * 1.05); worldGroup.add(ap); }
  }
  // стога сена
  for (const h of hay) {
    const R = h.r * S;
    const c = new THREE.Mesh(new THREE.CylinderGeometry(R, R * 1.1, 0.9, 16), mat('#e2b842')); c.position.set(h.x * S, .45, h.y * S); c.castShadow = true; worldGroup.add(c);
    const top = new THREE.Mesh(new THREE.ConeGeometry(R, 0.7, 16), mat('#ecc84a')); top.position.set(h.x * S, 1.25, h.y * S); top.castShadow = true; worldGroup.add(top);
  }
  // колодец
  {
    const R = well.r * S;
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 0.8, 20, 1, true), mat('#8a8a8a', { side: THREE.DoubleSide })); ring.position.set(well.x * S, .4, well.y * S); ring.castShadow = true; worldGroup.add(ring);
    const water = new THREE.Mesh(new THREE.CircleGeometry(R * .95, 20), mat('#1a2a44')); water.rotation.x = -Math.PI / 2; water.position.set(well.x * S, .5, well.y * S); worldGroup.add(water);
    for (const s of [-1, 1]) { const post = box(.1, 1.8, .1, '#6a4020'); post.position.set(well.x * S + s * R, .9, well.y * S); worldGroup.add(post); }
    const roof = new THREE.Mesh(new THREE.ConeGeometry(R * 1.4, .6, 4), mat('#b5402f')); roof.rotation.y = Math.PI / 4; roof.position.set(well.x * S, 2.0, well.y * S); roof.castShadow = true; worldGroup.add(roof);
  }
  // заборы
  const fenceAll = fences.concat([{ x: 0, y: -10, w: MW, h: 10 }, { x: 0, y: MH, w: MW, h: 10 }, { x: -10, y: 0, w: 10, h: MH }, { x: MW, y: 0, w: 10, h: MH }]);
  for (const f of fenceAll) {
    const w = f.w * S, d = f.h * S, cx = (f.x + f.w / 2) * S, cz = (f.y + f.h / 2) * S;
    for (const y of [.35, .75]) { const rail = box(Math.max(w, .08), .1, Math.max(d, .08), '#8a5a2a'); rail.position.set(cx, y, cz); worldGroup.add(rail); }
    const n = Math.ceil(Math.max(w, d) / 1.2);
    for (let i = 0; i <= n; i++) { const p = box(.12, 1, .12, '#5a3a1a'); p.position.set(w > d ? f.x * S + i * w / n : cx, .5, w > d ? cz : f.y * S + i * d / n); worldGroup.add(p); }
  }
  // далёкие холмы
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * Math.PI * 2, r = 60 + (i % 3) * 8;
    const hill = new THREE.Mesh(new THREE.SphereGeometry(14 + (i % 4) * 4, 16, 8), mat(i % 2 ? '#5c9a3a' : '#4f8a32'));
    hill.position.set(MW * S / 2 + Math.cos(a) * r, -6, MH * S / 2 + Math.sin(a) * r); worldGroup.add(hill);
  }
}

// ---------- Модель кота ----------
function makeCatMesh(c) {
  const g = new THREE.Group();
  const body = new THREE.MeshLambertMaterial({ color: c.color });
  const dark = new THREE.MeshLambertMaterial({ color: c.dark });
  const inner = new THREE.Group(); g.add(inner);
  const part = (geo, m, x, y, z) => { const p = new THREE.Mesh(geo, m); p.position.set(x, y, z); p.castShadow = true; inner.add(p); return p; };
  const torso = part(new THREE.SphereGeometry(1, 16, 12), body, -2, 14, 0); torso.scale.set(17, 11, 12);
  const head = new THREE.Group(); head.position.set(15, 24, 0); inner.add(head);
  const hp = (geo, m, x, y, z) => { const p = new THREE.Mesh(geo, m); p.position.set(x, y, z); p.castShadow = true; head.add(p); return p; };
  hp(new THREE.SphereGeometry(9.5, 16, 12), body, 0, 0, 0);
  for (const s of [-1, 1]) {
    const ear = hp(new THREE.ConeGeometry(3.8, 8, 4), body, -1, 9, s * 5); ear.rotation.x = s * -0.3;
    const earIn = hp(new THREE.ConeGeometry(2.2, 5, 4), mat('#ffb0c8'), 0.4, 8.5, s * 5); earIn.rotation.x = s * -0.3;
    hp(new THREE.SphereGeometry(2.3, 10, 8), mat(c.boss ? '#ff3a1a' : '#e8d84a'), 7.5, 2, s * 3.8);
    hp(new THREE.SphereGeometry(1.2, 8, 6), mat('#111'), 9.4, 2, s * 3.8);
    const wh = hp(new THREE.BoxGeometry(9, .3, .3), mat('#ffffff'), 10, -1.5, s * 4.5); wh.rotation.y = s * 0.4;
  }
  hp(new THREE.SphereGeometry(1.5, 8, 6), mat('#ff7aa0'), 9.3, -1, 0);
  if (c.boss) { const patch = hp(new THREE.BoxGeometry(1.5, 5, 5), mat('#111'), 8.5, 2, -3.8); const band = hp(new THREE.TorusGeometry(9.8, .6, 6, 24), mat('#111'), 0, 2, 0); band.rotation.y = Math.PI / 2; band.rotation.x = 0.3; }
  if (c.stripes) for (const x of [-12, -5, 2]) { const st = part(new THREE.BoxGeometry(3, 2, 20), dark, x, 22.5, 0); st.scale.y = 1; }
  // лапы
  const legs = [];
  for (const [x, z, k] of [[9, 7, 1], [9, -7, -1], [-11, 7, -1], [-11, -7, 1]]) {
    const pivot = new THREE.Group(); pivot.position.set(x, 12, z); inner.add(pivot);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 2.4, 12, 8), dark); leg.position.y = -6; leg.castShadow = true; pivot.add(leg);
    legs.push({ pivot, k, front: x > 0 });
  }
  // хвост
  const tail = new THREE.Group(); tail.position.set(-17, 16, 0); inner.add(tail);
  const tm = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 2.4, 24, 8), body); tm.position.y = 12; tm.castShadow = true; tail.add(tm);
  // имя и здоровье
  const lc = document.createElement('canvas'); lc.width = 256; lc.height = 64;
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(lc), transparent: true, depthWrite: false }));
  label.scale.set(64, 16, 1); label.position.y = 50; g.add(label);
  const mark = textSprite('❗', '#ff4a4a', 80, 128); mark.scale.set(14, 14, 1); mark.position.y = 64; mark.visible = false; g.add(mark);
  const stars = textSprite('⭐💫⭐', '#ffe94a', 60, 256); stars.scale.set(30, 10, 1); stars.position.y = 40; stars.visible = false; g.add(stars);
  const flag = textSprite('🏳️', '#fff', 80, 128); flag.scale.set(16, 16, 1); flag.position.set(0, 46, 0); flag.visible = false; g.add(flag);
  g.userData = { body, inner, head, legs, tail, label, lc, mark, stars, flag, lastHp: -1 };
  return g;
}
function drawLabel(c, u) {
  const g = u.lc.getContext('2d');
  g.clearRect(0, 0, 256, 64);
  if (c.hp > 0) {
    g.font = 'bold 26px Arial'; g.textAlign = 'center'; g.lineWidth = 5; g.strokeStyle = '#000'; g.fillStyle = '#fff';
    g.strokeText(c.name, 128, 26); g.fillText(c.name, 128, 26);
    g.fillStyle = '#000'; g.fillRect(48, 38, 160, 16);
    g.fillStyle = '#e8473b'; g.fillRect(51, 41, 154 * Math.max(0, c.hp) / c.maxHp, 10);
  }
  u.label.material.map.needsUpdate = true;
  u.lastHp = c.hp;
}
function updateCatMesh(c, m) {
  const u = m.userData, s = c.r / 20 * 1.15;
  m.scale.setScalar(S * s);
  m.position.set(c.x * S, 0, c.y * S);
  m.rotation.y = -c.angle;
  for (const L of u.legs) {
    let r = Math.sin(c.walk) * 0.6 * L.k;
    if (L.front && c.swipeT > 0) r = -1.4; // удар лапой
    if (L.front && c.windup > 0) r = 0.9;  // замах
    L.pivot.rotation.z = r;
  }
  u.tail.rotation.z = 0.9; u.tail.rotation.x = Math.sin(c.tailPhase) * 0.5;
  u.inner.rotation.z = c.windup > 0 ? 0.25 : c.swipeT > 0 ? -0.2 : 0;
  u.inner.position.y = c.surrender ? -6 : 0;
  u.body.emissive.set(c.hurt > 0 ? 0x992222 : 0x000000);
  if (u.lastHp !== c.hp) drawLabel(c, u);
  u.mark.visible = c.windup > 0;
  u.stars.visible = c.stun > 0; if (c.stun > 0) u.stars.material.rotation = Math.sin(performance.now() / 150) * .3;
  u.flag.visible = !!c.surrender;
  u.label.visible = c.hp > 0;
}

function noDepth(m) { m.traverse(o => { if (o.material) { o.material = o.material.clone(); o.material.depthTest = false; o.material.depthWrite = false; } o.renderOrder = 999; o.frustumCulled = false; }); return m; }
function makeViewModel() {
  viewModel = new THREE.Group();
  clubPivot = new THREE.Group(); clubPivot.position.set(0.22, -0.22, -0.32);
  const paw = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), mat('#f0a040')); clubPivot.add(paw);
  const fish = new THREE.Group(); fish.position.set(0, 0.03, -0.02); fish.rotation.x = 0.2; clubPivot.add(fish);
  const fb = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), mat('#7fa8c8')); fb.scale.set(0.05, 0.05, 0.17); fb.position.z = -0.14; fish.add(fb);
  const belly = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), mat('#c8dcea')); belly.scale.set(0.035, 0.03, 0.14); belly.position.set(0, -0.025, -0.14); fish.add(belly);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.14, 4), mat('#5a88b0')); tail.rotation.x = -Math.PI / 2; tail.scale.set(1, 1, 0.25); tail.position.z = -0.36; fish.add(tail);
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 6), mat('#111')); eye.position.set(0.045, 0.015, -0.03); fish.add(eye);
  clubPivot.scale.setScalar(0.75);
  viewModel.add(clubPivot);
  leftPaw = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), mat('#f0a040')); leftPaw.position.set(-0.24, -0.26, -0.34);
  grassInPaw = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), mat('#4caf32')); grassInPaw.position.set(0, 0.06, -0.02); leftPaw.add(grassInPaw);
  viewModel.add(leftPaw);
  noDepth(viewModel);
  camera.add(viewModel);
}
function updateViewModel(t) {
  const bob = Math.hypot(player.vx, player.vy) > 5 ? Math.sin(player.walk) * 0.012 : 0;
  // замах рыбьим хвостом справа налево
  if (player.swipeT > 0) {
    const k = 1 - player.swipeT / 0.2;
    clubPivot.rotation.set(-0.3, 1.0 - 2.2 * k, -0.6);
    clubPivot.position.set(0.22 - 0.25 * k, -0.18, -0.36);
  } else {
    clubPivot.rotation.set(0.5, 0.15, -0.25);
    clubPivot.position.set(0.26, -0.25 + bob, -0.34);
  }
  const th = player.throwT > 0 ? player.throwT / .25 : 0;
  leftPaw.position.set(-0.24 + th * 0.12, -0.26 + bob + th * 0.12, -0.34 - th * 0.2);
  grassInPaw.visible = player.tearT > 0;
  if (player.tearT > 0) leftPaw.position.y = -0.34;
}

// ---------- Снаряды, огонь, бонусы ----------
const fireTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 2, 32, 32, 30); gr.addColorStop(0, '#fff6a0'); gr.addColorStop(.4, '#ff9a2a'); gr.addColorStop(1, 'rgba(255,60,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
})();
let fireMat;
function makeProj(p) {
  if (p.type === 'stone') { const m = ball(.1, '#6a6a6a'); return m; }
  if (p.type === 'grass') {
    const g = new THREE.Group(); g.add(ball(.08, '#7a5a30'));
    for (let i = 0; i < 6; i++) { const b = new THREE.Mesh(new THREE.ConeGeometry(.03, .25, 4), mat('#4caf32')); b.position.set(Math.cos(i) * .06, .1, Math.sin(i) * .06); b.rotation.set(Math.sin(i) * .6, 0, Math.cos(i) * .6); g.add(b); }
    return g;
  }
  if (p.type === 'thread') { const m = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, .7, 5), mat(p.color)); m.rotation.order = 'YXZ'; return m; }
}
function makeClewMesh(k) {
  const g = new THREE.Group();
  g.add(ball(.28, k.color));
  for (let i = 0; i < 3; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(.27, .02, 6, 24), mat('#ffffff')); r.rotation.set(i * 1.1, i * .7, 0); g.add(r); }
  const ring = new THREE.Mesh(new THREE.RingGeometry(85 * S - .1, 85 * S, 40), new THREE.MeshBasicMaterial({ color: 0xff2a2a, transparent: true, opacity: .6, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = .05;
  g.userData.ring = ring; dynGroup.add(ring);
  return g;
}
function makeFire(f) {
  fireMat = fireMat || new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(fireTex), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const g = new THREE.Group();
  for (let i = 0; i < 18; i++) {
    const sp = new THREE.Sprite(fireMat.clone()); const a = rnd(0, 7), r = Math.sqrt(Math.random()) * f.r * S;
    sp.position.set(Math.cos(a) * r, rnd(.2, .7), Math.sin(a) * r); sp.userData.base = rnd(.6, 1.1); g.add(sp);
  }
  const glow = new THREE.Mesh(new THREE.CircleGeometry(f.r * S, 32), new THREE.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, opacity: .35, depthWrite: false }));
  glow.rotation.x = -Math.PI / 2; glow.position.y = .04; g.add(glow);
  return g;
}
const PICK_EMOJI = { fish: '🐟', basket: '🧺', stones: '🪨' };
function makePickup(p) { const sp = textSprite(PICK_EMOJI[p.type] || '?', '#fff', 90, 128); sp.scale.set(.7, .7, 1); return sp; }
const partGeo = new THREE.BoxGeometry(.07, .07, .07);
function makePart(p) { return new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({ color: p.c, transparent: true })); }
function makeText(t) { const sp = textSprite(t.t, t.c, 56, 512); sp.scale.multiplyScalar(0.5 * t.size / 22); return sp; }

function sync(list, make, upd) {
  for (const o of list) {
    let m = live.get(o);
    if (!m) { m = make(o); if (!m) continue; live.set(o, m); dynGroup.add(m); m.userData.seen = 0; }
    m.userData.seen = frameNo; upd(o, m);
  }
}
let frameNo = 0;
function render3D(t, dt) {
  frameNo++;
  sync(cats.filter(c => !c.isPlayer), makeCatMesh, updateCatMesh);
  sync(projs, makeProj, (p, m) => {
    m.position.set(p.x * S, p.type === 'thread' ? .45 : .55, p.y * S);
    if (p.type === 'thread') { m.rotation.y = -Math.atan2(p.vy, p.vx); m.rotation.z = Math.PI / 2; m.rotation.x = Math.sin(p.wob) * .3; }
    else m.rotation.set(p.spin, p.spin * .7, 0);
  });
  sync(clews, makeClewMesh, (k, m) => {
    const tt = Math.min(k.t, 1), h = Math.sin(tt * Math.PI) * 2.6 + .4;
    m.position.set(k.x * S, h, k.y * S); m.rotation.set(k.t * 10, k.t * 6, 0);
    m.userData.ring.position.set(k.ex * S, .05, k.ey * S);
  });
  sync(fires, makeFire, (f, m) => {
    m.position.set(f.x * S, 0, f.y * S);
    const k = f.life / 1.2;
    for (const sp of m.children) if (sp.isSprite) { const s = sp.userData.base * (0.6 + 0.4 * Math.sin(t / 60 + sp.id)) * (0.5 + k); sp.scale.set(s, s * 1.3, 1); sp.material.opacity = k; }
    m.children[m.children.length - 1].material.opacity = .35 * k;
  });
  sync(pickups.filter(p => PICK_EMOJI[p.type]), makePickup, (p, m) => m.position.set(p.x * S, .45 + Math.sin(p.t * 4) * .1, p.y * S));
  sync(parts, makePart, (p, m) => { m.position.set(p.x * S, .25 + p.life * .8, p.y * S); m.material.opacity = Math.min(1, p.life * 2); m.visible = dist(p, player) > 30; });
  sync(texts, makeText, (tx, m) => { m.position.set(tx.x * S, tx.h, tx.y * S); m.material.opacity = Math.min(1, tx.life * 2); });
  // убрать то, чего больше нет
  for (const [o, m] of live) if (m.userData.seen !== frameNo) {
    dynGroup.remove(m); live.delete(o);
    if (m.userData.ring) dynGroup.remove(m.userData.ring);
    m.traverse(x => { if (x.material && x.material.map && x.isSprite && x.material.map.image !== fireTex) x.material.map.dispose(); });
  }
  // земля с проплешинами от сорванной травы
  groundTimer -= dt;
  if (groundDirty && groundTimer <= 0) { drawGround(); groundDirty = false; groundTimer = .4; }
  // камера в глазах Барсика
  const eye = 0.7 + (Math.hypot(player.vx, player.vy) > 5 ? Math.abs(Math.sin(player.walk)) * 0.03 : 0) - (player.hp <= 0 ? 0.4 : 0);
  camera.position.set(player.x * S + rnd(-1, 1) * shake * .004, eye, player.y * S + rnd(-1, 1) * shake * .004);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = -player.angle - Math.PI / 2;
  camera.rotation.x = -0.06;
  camera.rotation.z = player.stun > 0 ? Math.sin(t / 120) * 0.12 : (player.hp <= 0 ? 0.5 : 0);
  updateViewModel(t);
  viewModel.visible = player.hp > 0;
  // цель автоприцела
  const tg = aimTarget();
  targetRing.visible = !!tg;
  if (tg) { targetRing.position.set(tg.x * S, .04, tg.y * S); const s = tg.r / 20 * (1 + Math.sin(t / 150) * .08); targetRing.scale.set(s, s, s); }
  document.getElementById('cross').classList.toggle('lock', !!tg);
  document.getElementById('hurt').style.opacity = Math.max(0, player.hurt * 3, player.hp > 0 && player.hp < 25 ? 0.35 : 0);
  document.getElementById('stunned').classList.toggle('hidden', !(player.stun > 0));
  renderer.render(scene, camera);
  drawMini();
}

// ---------- Мини-карта (стрелка — куда смотрит Барсик) ----------
const mini = document.getElementById('mini'), mctx = mini.getContext('2d');
function drawMini() {
  const ms = mini.width / MW;
  mctx.fillStyle = '#5c9a3a'; mctx.fillRect(0, 0, mini.width, mini.height);
  mctx.strokeStyle = '#c9a56a'; mctx.lineWidth = 4;
  for (const pth of paths) { mctx.beginPath(); pth.forEach(([x, y], i) => i ? mctx.lineTo(x * ms, y * ms) : mctx.moveTo(x * ms, y * ms)); mctx.stroke(); }
  for (const b of houses) { mctx.fillStyle = b.roof; mctx.fillRect(b.x * ms, b.y * ms, b.w * ms, b.h * ms); }
  mctx.fillStyle = '#5aa0e0'; mctx.beginPath(); mctx.ellipse(pond.x * ms, pond.y * ms, pond.rx * ms, pond.ry * ms, 0, 0, 7); mctx.fill();
  for (const c of cats) if (c.team === 1 && (c.hp > 0 || c.surrender)) { mctx.fillStyle = c.surrender ? '#fff' : c.boss ? '#ff3a1a' : '#ffef4a'; mctx.beginPath(); mctx.arc(c.x * ms, c.y * ms, c.boss ? 5 : 3.5, 0, 7); mctx.fill(); }
  mctx.save(); mctx.translate(player.x * ms, player.y * ms); mctx.rotate(player.angle);
  mctx.fillStyle = '#5fff5f'; mctx.strokeStyle = '#000'; mctx.lineWidth = 1.5;
  mctx.beginPath(); mctx.moveTo(8, 0); mctx.lineTo(-5, -5); mctx.lineTo(-3, 0); mctx.lineTo(-5, 5); mctx.closePath(); mctx.fill(); mctx.stroke();
  mctx.restore();
}

  if (!on) document.getElementById('hint').textContent = '';
}
// buttons: [{label, key: 'Enter'|'Digit1'..., kbd: 'Enter', fn, alt}]
function showScreen(html, buttons) {
  screenKeys = {};
  screen.innerHTML = html + '<div class="btns"></div>';
  const row = screen.querySelector('.btns');
  for (const b of buttons) {
    const el = document.createElement('button');
    if (b.alt) el.className = 'alt';
    el.innerHTML = `${b.label}<kbd>${b.kbd}</kbd>`;
    const run = () => { sound('pick'); b.fn(); };
    el.onclick = run; row.appendChild(el);
    for (const k of [].concat(b.key)) screenKeys[k] = run;
  }
  screen.classList.remove('hidden');
  setPlayUI(false);
}
function hideScreen() { screen.classList.add('hidden'); screenKeys = {}; }

const CONTROLS = `
  <table>
    <tr><td><b>← →</b> (или A D)</td><td>повернуться</td></tr>
    <tr><td><b>↑ ↓</b> (или W S)</td><td>бежать вперёд / назад</td></tr>
    <tr><td><b>Q E</b> (Й У)</td><td>шаг вбок</td></tr>
    <tr><td><b>Z</b> (Я) или <b>Пробел</b></td><td>удар рыбьим хвостом 🐟 (можно держать)</td></tr>
    <tr><td><b>X</b> (Ч)</td><td>кинуть камешек 🪨</td></tr>
    <tr><td><b>C</b> (С)</td><td>кинуть клубок 🧶</td></tr>
  </table>`;

function showMenu() {
  state = 'menu';
  const saved = store.get('kotyLevel', 0);
  const btns = [];
  if (saved > 0) btns.push({ label: `Продолжить: уровень ${saved + 1}`, key: 'Enter', kbd: 'Enter', fn: () => showStory(saved) });
  btns.push({ label: saved > 0 ? 'Начать сначала' : 'МЯУ, В БОЙ!', key: saved > 0 ? 'Digit1' : ['Enter', 'Digit1'], kbd: saved > 0 ? '1' : 'Enter', fn: () => { player = null; showStory(0); } });
  btns.push({ label: '🎤 Голос Демида', key: 'Digit2', kbd: '2', alt: true, fn: showVoice });
  showScreen(`<h1>🐱 КОТЫ-ДРАЧУНЫ 🐱</h1>
    <p>В деревню Мурлыкино пришла банда дворовых котов во главе с <b>Рыжим Атаманом</b>. Они таскают сметану и пугают цыплят!
    Рыжий котик <b>Барсик</b> берёт свою <b>рыбий хвост-дубинку</b> и выходит защищать деревню. Ты смотришь его глазами!</p>
    <p><b>Играем только клавиатурой, мышка не нужна:</b></p>${CONTROLS}
    <p>Хулиган перед ударом <b>замахивается</b> — над ним появляется ❗ Ударь первым или отбеги!<br>
    Красный круг на земле — в кого полетит камешок. У тебя <b>1 камешек</b> и <b>1 клубок</b>, за каждого побеждённого хулигана <b>+2 камешка</b>.<br>
    Промазал камешком? Барсик сам <b>сдерёт траву</b> и кинет её — это <b>оглушающий удар</b> 🌿💫<br>
    Клубок разлетается на ниточки (−5) и поджигает всё рядом (−5 огнём). Подбирай 🐟 рыбку и 🧺 корзинку с клубком.<br>
    Игра сама запоминает, до какого уровня ты дошёл.</p>
    <p style="font-size:14px;opacity:.7">Игру придумал Демид 🐾 2026</p>`, btns);
}
function showStory(i) {
  state = 'story';
  const L = LEVELS[i];
  showScreen(`<h2>Уровень ${i + 1}: ${L.name}</h2><p class="say">${L.story}</p>`,
    [{ label: 'ВПЕРЁД!', key: 'Enter', kbd: 'Enter', fn: () => { hideScreen(); sound('meow'); startLevel(i); setPlayUI(true); } }]);
}
function showWin() {
  if (levelIdx + 1 < LEVELS.length) {
    store.set('kotyLevel', Math.max(store.get('kotyLevel', 0), levelIdx + 1));
    showScreen(`<h1>ПОБЕДА! 🐾</h1><p>Хулиганы разбежались! Барсик съел рыбку и отдохнул.<br>Игра запомнила: следующий — уровень ${levelIdx + 2}.</p>`,
      [{ label: 'ДАЛЬШЕ', key: 'Enter', kbd: 'Enter', fn: () => showStory(levelIdx + 1) }]);
  } else {
    showEnding(0);
  }
}
// концовка: Рыжий Атаман становится другом
const ENDING = [
  ['😿', 'Рыжий Атаман сел на траву, поднял белый флажок и вздохнул:', '«Мяу… Я ведь не злой. У меня нет дома, и я всё время голодный. Поэтому мы и таскали сметану…»'],
  ['😺', 'Барсик опустил свой рыбий хвост:', '«Так бы сразу и сказал! Пойдём к бабушке — у неё сметаны на всех хватит!»'],
  ['👵', 'Бабушка налила две большие миски сметаны. Хулиганам тоже досталось по блюдечку.', 'А цыплята больше никого не боятся. Теперь Рыжий — лучший друг Барсика! 🧡'],
];
function showEnding(n) {
  state = 'end';
  if (n < ENDING.length) {
    const [face, who, say] = ENDING[n];
    showScreen(`<h1 style="font-size:90px">${face}</h1><p>${who}</p><p class="say">${say}</p>`,
      [{ label: 'ДАЛЬШЕ', key: 'Enter', kbd: 'Enter', fn: () => { sound('meow'); showEnding(n + 1); } }]);
  } else {
    store.set('kotyLevel', 0);
    showScreen(`<h1>🏆 МУРЛЫКИНО СПАСЕНО! 🏆</h1><p class="say">Конец первой части.<br>Скоро: Барсик и Рыжий вместе защищают деревню от вороньей стаи… 🐦‍⬛</p>`,
      [{ label: 'ИГРАТЬ ЕЩЁ', key: 'Enter', kbd: 'Enter', fn: () => { player = null; showMenu(); } }]);
  }
}
function showLose() {
  showScreen(`<h1>МЯУ-У… 😿</h1><p>Барсика побили. Но настоящий кот не сдаётся!<br>Подсказка: смотри на мини-карту — там видно хулиганов. Увидел ❗ — бей первым или отбегай.</p>`,
    [{ label: 'ЕЩЁ РАЗ', key: 'Enter', kbd: 'Enter', fn: () => { hideScreen(); player.hp = 100; startLevel(levelIdx); setPlayUI(true); } },
     { label: 'В меню', key: 'Escape', kbd: 'Esc', alt: true, fn: showMenu }]);
}

// ---------- Экран записи голоса ----------
const VOICE_ITEMS = [['meow', 'Мяу', 'когда Барсику больно и когда он побеждает'], ['boom', 'Бабах', 'когда взрывается клубок'], ['oy', 'Ой', 'когда в Барсика попали']];
let voiceMsg = '';
async function recordVoice(k) {
  if (!navigator.mediaDevices || !window.MediaRecorder) { voiceMsg = 'Этот браузер не умеет записывать звук. Выбери готовый звуковой файл.'; return showVoice(); }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) {
    voiceMsg = 'Микрофон здесь недоступен. Открой файл «Коты-драчуны.html» из папки «Игра Демида» — там запись работает. Или выбери готовый звуковой файл.';
    return showVoice();
  }
  const rec = new MediaRecorder(stream), chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const fr = new FileReader();
    fr.onload = () => { saveVoice(k, fr.result); };
    fr.readAsDataURL(new Blob(chunks, { type: rec.mimeType }));
  };
  voiceMsg = '🔴 Говори «' + VOICE_ITEMS.find(v => v[0] === k)[1] + '»!';
  showVoice();
  rec.start();
  setTimeout(() => rec.stop(), 1600);
}
function saveVoice(k, data) {
  voices[k] = data;
  voiceMsg = store.set('kotyVoices', voices) ? '✅ Записано! Слушай:' : '⚠️ Звук слишком длинный, не поместился. Попробуй короче.';
  lastVoice = 0; playVoice(k);
  showVoice();
}
function showVoice() {
  state = 'voice';
  const rows = VOICE_ITEMS.map(([k, name, when], i) => `<tr><td><b>${i + 1}</b> — «${name}»</td><td>${when}</td><td>${voices[k] ? '✅ есть' : '— нет'}</td>
    <td><input type="file" accept="audio/*" data-k="${k}"></td></tr>`).join('');
  showScreen(`<h2>🎤 Голос Демида</h2>
    <p>Нажми цифру и сразу скажи слово в микрофон (запись 1,5 секунды). Потом твой голос будет звучать в игре!</p>
    <table>${rows}</table>
    <p class="say">${voiceMsg || 'Можно и выбрать готовый звуковой файл кнопкой справа.'}</p>`,
    [{ label: 'Записать «Мяу»', key: 'Digit1', kbd: '1', fn: () => recordVoice('meow'), alt: true },
     { label: 'Записать «Бабах»', key: 'Digit2', kbd: '2', fn: () => recordVoice('boom'), alt: true },
     { label: 'Записать «Ой»', key: 'Digit3', kbd: '3', fn: () => recordVoice('oy'), alt: true },
     { label: 'Стереть всё', key: 'Digit0', kbd: '0', alt: true, fn: () => { voices = {}; store.set('kotyVoices', voices); voiceMsg = 'Стёрто. Снова обычные звуки.'; showVoice(); } },
     { label: 'Назад', key: ['Enter', 'Escape'], kbd: 'Enter', fn: () => { voiceMsg = ''; showMenu(); } }]);
  for (const inp of screen.querySelectorAll('input[type=file]')) inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 400000) { voiceMsg = '⚠️ Файл слишком большой. Нужен короткий звук, 1–2 секунды.'; return showVoice(); }
    const fr = new FileReader(); fr.onload = () => saveVoice(inp.dataset.k, fr.result); fr.readAsDataURL(f);
  };
}

// ================= Запуск =================
let menuAngle = 0;
function loop(t) {
  const dt = Math.min(0.033, (t - lastTime) / 1000 || 0); lastTime = t;
  if (player && (state === 'play' || state === 'win' || state === 'lose')) update(dt);
  if (player && cats) render3D(t, dt);
  else {
    // в меню камера медленно облетает деревню
    menuAngle += dt * 0.08;
    camera.position.set(MW * S / 2 + Math.cos(menuAngle) * 22, 9, MH * S / 2 + Math.sin(menuAngle) * 16);
    camera.rotation.set(0, 0, 0); camera.lookAt(MW * S / 2, 0, MH * S / 2);
    viewModel.visible = false; targetRing.visible = false;
    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
}
if (!window.THREE) {
  document.getElementById('loading').textContent = 'Не получилось загрузить 3D. Проверь интернет и обнови страницу.';
} else {
  init3D();
  makeMap(); cats = []; pickups = []; build3D();
  document.getElementById('loading').remove();
  showMenu();
  requestAnimationFrame(loop);
}
</script>
